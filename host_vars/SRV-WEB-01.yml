---
# Settings for one server. The file name must match the name used in your
# inventory, exactly. Copy this file for each server you want to configure.
#
# Anything you leave out falls back to group_vars/all.yml.

# Services checked by name, on top of the "automatic but not running" list.
check_services:
  - Winmgmt
  - W3SVC
  - MSDTC

# URLs called from this server.
#   name:           short label shown in the report
#   url:            address to call
#   expect_content: optional, text that must appear in the page
check_urls:
  - name: intranet
    url: "http://{{ inventory_hostname | lower }}/"
    expect_content: "Welcome"

  - name: healthcheck
    url: "http://{{ inventory_hostname | lower }}/health"
