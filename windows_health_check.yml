---
# ============================================================================
#  Post-update health check for Windows servers.
#
#    ansible-playbook -i inventory.ini windows_health_check.yml
#
#  One task per thing we check, so you can see in the output which check ran
#  and which one had a problem. Read-only: nothing is changed on the servers.
#  The report is informative, it does not decide what is good or bad.
# ============================================================================

- name: Check the Windows servers and write the report
  hosts: windows
  gather_facts: true            # gives ansible_distribution and ansible_uptime_seconds
  ignore_unreachable: true      # a server that is down still gets a row in the CSV

  tasks:

    # A failing check should not cost us the other ones, so each gathering
    # task is allowed to fail. The empty columns in the CSV are the signal,
    # and the red task in the output tells you which check it was.
    #
    # Every setting is read with a | default(...) so the playbook runs on its
    # own, even with no group_vars/host_vars at all. A default() is only a
    # fallback for an undefined name: it has no precedence and never overrides
    # a value you set anywhere. Putting these defaults in the play's vars:
    # block instead would sit ABOVE host_vars and silently override it.

    - name: Check the last reboot and whether a restart is pending
      ansible.windows.win_reboot_info:
      register: reboot
      failed_when: false

    - name: List the automatic services that are not running
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Ignore)
          $Ansible.Changed = $false
          Get-CimInstance Win32_Service |
              Where-Object { $_.StartMode -eq 'Auto' -and $_.State -ne 'Running' } |
              Where-Object {
                  # Kept unless its name matches one of the ignore patterns.
                  # -like, so 'edgeupdate*' covers edgeupdate and edgeupdatem.
                  $name = $_.Name
                  -not ($Ignore | Where-Object { $name -like $_ })
              } |
              Select-Object -ExpandProperty Name
        parameters:
          Ignore: "{{ check_services_ignore | default([]) }}"
      register: auto_services
      failed_when: false

    - name: Check the services we watch by name
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Names)
          $Ansible.Changed = $false
          # The strings are what the report prints; not_running is what the
          # compliance rule reads, so nothing has to parse them back.
          $notRunning = 0
          foreach ($name in $Names) {
              $service = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($service) {
                  if ($service.Status -ne 'Running') { $notRunning++ }
                  "$name=$($service.Status)"
              } else {
                  $notRunning++
                  "$name=not installed"
              }
          }
          $Ansible.Result = @{ not_running = $notRunning }
        parameters:
          Names: "{{ check_services | default([]) }}"
      register: watched_services
      failed_when: false

    - name: Check the drive {{ check_drive | default('C:') }}
      ansible.windows.win_powershell:
        script: |
          param([string]$Drive)
          $Ansible.Changed = $false
          $disk = Get-CimInstance Win32_LogicalDisk |
              Where-Object { $_.DeviceID -eq $Drive } |
              Select-Object -First 1
          if ($disk -and $disk.Size -gt 0) {
              $Ansible.Result = @{
                  free_gb = [math]::Round($disk.FreeSpace / 1GB, 1)
              }
          }
        parameters:
          Drive: "{{ check_drive | default('C:') }}"
      register: disk
      failed_when: false

    - name: Call each URL from the server
      ansible.windows.win_uri:
        url: "{{ item.url }}"
        return_content: true
        validate_certs: "{{ not (check_url_ignore_cert_errors | default(true) | bool) }}"
        timeout: "{{ check_url_timeout | default(15) }}"
      loop: "{{ check_urls | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: url_checks
      failed_when: false        # a bad status code is information, not an error
      changed_when: false

    - name: Turn each URL result into one line
      ansible.builtin.set_fact:
        url_summary: "{{ url_summary | default([]) + [line] }}"
        url_problems: "{{ url_problems | default([]) + ([item.item.name] if not url_ok else []) }}"
      loop: "{{ url_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      vars:
        code: "{{ item.status_code | default('no answer') }}"
        expected: "{{ item.item.expect_content | default('') }}"
        body: "{{ item.content | default('') }}"
        line: "{{ item.item.name }} ({{ item.item.url }}) {{ code }}{{ content_note }}"
        # The endpoint works: it answered 200 and, when one was asked for, the
        # expected text is there.
        url_ok: "{{ (item.status_code | default(0)) == 200 and (not expected or expected in body) }}"
        # Nothing to say about the content when we asked for nothing, or when
        # the server never answered.
        content_note: >-
          {{ '' if not expected or item.status_code is not defined
             else (' "' ~ expected ~ '" found' if expected in body
                   else ' "' ~ expected ~ '" MISSING') }}

    - name: Work out the uptime in days
      ansible.builtin.set_fact:
        uptime_days: "{{ (ansible_uptime_seconds | int / 86400) | round(1) }}"
      when: ansible_uptime_seconds is defined

    # Compliance fails closed: a rule whose data is missing counts as not met,
    # because a check that did not run proves nothing. Each rule yields either
    # an empty string when it is met, or a short reason why it is not - and a
    # rule that could not be evaluated says so, rather than claiming the
    # condition was violated.
    - name: Work out why the server would not be compliant
      ansible.builtin.set_fact:
        compliance_problems: "{{ problems | reject('equalto', '') | list }}"
      vars:
        auto_problem: >-
          {{ 'automatic services not checked' if auto_services.output is not defined
             else ('automatic service stopped' if auto_services.output | length > 0 else '') }}
        watched_problem: >-
          {{ 'watched services not checked' if watched_services.result.not_running is not defined
             else ('watched service stopped' if watched_services.result.not_running | int > 0 else '') }}
        disk_problem: >-
          {{ 'disk not checked' if disk.result.free_gb is not defined
             else ('free space below ' ~ (compliance_min_free_gb | default(5)) ~ ' GB'
                   if disk.result.free_gb | float < compliance_min_free_gb | default(5) | float
                   else '') }}
        # A server with no URL configured has nothing to fail. One that has
        # URLs but never ran the check is unknown, not fine.
        url_problem: >-
          {{ 'URLs not checked' if check_urls | default([]) | length > 0 and url_summary is not defined
             else ('URL failing' if url_problems | default([]) | length > 0 else '') }}
        reboot_problem: >-
          {{ 'restart pending not checked' if reboot.reboot_required is not defined
             else ('restart pending' if reboot.reboot_required else '') }}
        problems:
          - "{{ auto_problem }}"
          - "{{ watched_problem }}"
          - "{{ disk_problem }}"
          - "{{ url_problem }}"
          - "{{ reboot_problem }}"

    - name: Put together this server's line for the report
      ansible.builtin.set_fact:
        report:
          compliance: "{{ 'yes' if compliance_problems | length == 0 else 'no' }}"
          compliance_reasons: "{{ compliance_problems | join(' | ') }}"
          # Tells an unreachable server apart from one that answered but whose
          # checks all failed - both otherwise leave every column empty.
          # reboot.unreachable rather than a test on the facts, so a connection
          # that drops after gather_facts is still caught.
          status: "{{ 'not reachable' if reboot.unreachable | default(false) else 'reachable' }}"
          last_boot: >-
            {{ '%Y-%m-%d %H:%M' | strftime(reboot.last_reboot.time_epoch | int)
               if reboot.last_reboot is defined else '' }}
          uptime_days: "{{ uptime_days | default('') }}"
          # Left empty rather than "no" when the check itself failed: an
          # unanswered question must not read as a reassuring answer.
          pending_restart: >-
            {{ '' if reboot.reboot_required is not defined
               else ('yes' if reboot.reboot_required else 'no') }}
          pending_reasons: "{{ reboot.reboot_required_reasons | default([]) | map(attribute='source') | join(' | ') }}"
          auto_stopped_count: "{{ auto_services.output | length if auto_services.output is defined else '' }}"
          auto_stopped: "{{ auto_services.output | default([]) | join(' | ') }}"
          watched_services: "{{ watched_services.output | default([]) | join(' | ') }}"
          disk_free_gb: "{{ disk.result.free_gb | default('') }}"
          urls: "{{ url_summary | default([]) | join(' | ') }}"

    - name: Show what was found
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} [{{ report.status }}]
          compliant={{ report.compliance }}
          {{ '(' ~ report.compliance_reasons ~ ')' if report.compliance_reasons else '' }}
          | booted {{ report.last_boot | default('?') }}
          | up {{ report.uptime_days | default('?') }} days
          | restart pending: {{ report.pending_restart }}
          | {{ check_drive | default('C:') }} free: {{ report.disk_free_gb }} GB
          | auto services stopped: {{ report.auto_stopped_count }}
          | {{ report.watched_services }}
          | {{ report.urls }}

    # ------------------------------------------------------------------
    #  The report, written once on the control node.
    #
    #  These tasks live in the same play as the checks on purpose: a second
    #  play would mean repeating the `hosts:` line, and having to change the
    #  group name in two places. With the linear strategy every host has
    #  finished the tasks above before these run.
    # ------------------------------------------------------------------

    # One single call to `date`, then everything else is derived from it.
    # Asking for the time twice could give two different answers - a second
    # apart, or a month apart on the last night of a month.
    - name: Take the timestamp of this run
      run_once: true
      ansible.builtin.set_fact:
        run_epoch: "{{ lookup('pipe', 'date +%s') | int }}"

    - name: Derive the file name, the folder and the date shown in the report
      run_once: true
      ansible.builtin.set_fact:
        run_id: "{{ '%Y%m%d-%H%M%S' | strftime(run_epoch) }}"
        report_month: "{{ '%Y-%m' | strftime(run_epoch) }}"
        checked_at: "{{ '%Y-%m-%d %H:%M' | strftime(run_epoch) }}"

    - name: Create reports/YYYY-MM/
      run_once: true
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ playbook_dir }}/reports/{{ report_month }}"
        state: directory
        mode: "0755"

    - name: Write the CSV file
      run_once: true
      delegate_to: localhost
      ansible.builtin.template:
        src: report.csv.j2
        dest: "{{ playbook_dir }}/reports/{{ report_month }}/health_{{ run_id }}.csv"
        mode: "0644"

    - name: Where the report is
      run_once: true
      ansible.builtin.debug:
        msg: "Report written to reports/{{ report_month }}/health_{{ run_id }}.csv"
