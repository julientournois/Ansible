---
# Defaults for every server.
#
# They live in group_vars/all.yml, which Ansible reads with a LOWER priority
# than group_vars/<group>.yml and host_vars/<server>.yml. Anything you set for
# one server therefore wins over what is here.
#
# Do not move these into the playbook's own `vars:` block: that has a HIGHER
# priority than host_vars, so it would silently override your per-server
# settings.

# Drive to report on.
check_drive: "C:"

# Empty by default, so a server with no host_vars file of its own still runs -
# it simply reports nothing for these two.
check_services: []
check_urls: []

# Services left out of the "automatic but not running" list. Matched on the
# service NAME - the one the report prints - with * as a wildcard.
#
# These are the usual suspects: updaters that only run on demand, and the
# per-user services whose name ends in a random suffix. Trim or extend it from
# what you actually see in the auto_services_stopped column; this list is a
# starting point, not a verified truth about your own servers.
check_services_ignore:
  - "edgeupdate*"          # Microsoft Edge updater, started on demand
  - "gupdate*"             # Google updater, started on demand
  - "CDPUserSvc_*"         # per-user service, random suffix
  - "OneSyncSvc_*"         # per-user service, random suffix
  - "WpnUserService_*"     # per-user service, random suffix

check_url_timeout: 15
# Internal sites often use self-signed certificates.
check_url_ignore_cert_errors: true

# CSV delimiter. ';' opens cleanly in a French Excel, ',' is RFC 4180.
# It lives here rather than in the playbook's vars: block, so that it stays
# overridable per group, per server and with -e.
report_delimiter: ";"
